<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Calculadora</h1>
    </header>

    <main>
      <div class="container">
        <div class="display">0</div>
        <div class="buttons">
          <button class="btn backspace"><-</button>
          <button class="btn delete-entry">CE</button>
          <button class="btn delete-all">C</button>
          <button class="btn operation">÷</button>
          <button class="btn number">7</button>
          <button class="btn number">8</button>
          <button class="btn number">9</button>
          <button class="btn operation">x</button>
          <button class="btn number">4</button>
          <button class="btn number">5</button>
          <button class="btn number">6</button>
          <button class="btn operation">-</button>
          <button class="btn number">1</button>
          <button class="btn number">2</button>
          <button class="btn number">3</button>
          <button class="btn operation">+</button>
          <button class="btn number">0</button>
          <button class="btn number">.</button>
          <button class="btn operation equals">=</button>
        </div>
      </div>
    </main>

    <footer>
      <p>Servidores y API's - Calculadora en TypeScript</p>
    </footer>

    <script src="../dist/index.js"></script>
  </body>
</html>
