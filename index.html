<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculators</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>

  <body>
    <header>
      <h1>CALCULATORS, WATCH AND TIMER</h1>
    </header>

    <main>
      <div class="timers">
        <div class="watch">
          <h1>Watch</h1>
          <div class="watch-container"></div>
        </div>
        <div class="chrono">
          <h1>Chrono/Timer</h1>
          <div class="timer-container">
            <p class="time"></p>
            <div class="controls">
              <button class="start">Start</button>
              <button class="pause">Pause</button>
              <button class="reset">Reset</button>
              <button class="timer">Timer</button>
            </div>
          </div>
        </div>
      </div>
      <div class="calculators">
        <h1>Calculators</h1>
        <button class="addNew">Add a new calculator</button>
        <div class="calcs-container"></div>
      </div>
    </main>

    <footer>
      <p>Servidores y API's - Calculator with TypeScript</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
